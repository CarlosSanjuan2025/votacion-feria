<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vota por tu proyecto favorito</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<div id="demo" class="demo" hidden>MODO DEMO: configura Firebase en config.js para que los votos se compartan</div>
<header><h1 id="t"></h1><p id="i"></p><p>Elige <b>un</b> proyecto y pulsa “Votar”</p></header>
<main id="m"></main>
<div class="bar" id="bar"><button id="b" disabled>Votar</button></div>
<script src="config.js"></script><script src="common.js"></script>
<script>
document.getElementById("t").textContent = C.TITULO;
document.getElementById("i").textContent = C.INSTITUCION;
if (DEMO) document.getElementById("demo").hidden = false;
const m = document.getElementById("m"), b = document.getElementById("b");
let sel = null;

function yaVoto() {
m.innerHTML = '<div class="msg"><h2>¡Gracias por votar! 🎉</h2><p>Tu voto ya quedó registrado en este dispositivo.</p></div>';
document.getElementById("bar").hidden = true;
}
if (localStorage.getItem("voto_ok")) yaVoto();
else {
C.PROYECTOS.forEach(p => {
const l = document.createElement("label");
l.className = "card";
l.innerHTML = '<input type="radio" name="p" value="' + p.id + '"><div><b></b><span></span></div>';
const f = crearFoto(p, "ph");
f.onclick = e => { if (f.tagName === "IMG") { e.preventDefault(); ampliar(p.foto); } };
l.insertBefore(f, l.children[1]);
l.querySelector("b").textContent = p.nombre;
l.querySelector("span").textContent = "Líder: " + p.lider;
l.querySelector("input").onchange = () => {
sel = p.id; b.disabled = false;
document.querySelectorAll(".card").forEach(c => c.classList.remove("sel"));
l.classList.add("sel");
};
m.appendChild(l);
});
b.onclick = async () => {
if (!sel) return;
b.disabled = true; b.textContent = "Enviando…";
try { await enviarVoto(sel); localStorage.setItem("voto_ok", sel); yaVoto(); }
catch (e) { alert("No se pudo enviar. Revisa tu internet e intenta otra vez."); b.disabled = false; b.textContent = "Votar"; }
};
}
</script></body></html>
